<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Seraphina OS Harness: Home">
      <span class="logo"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-logo"/></svg></span>
      <span class="brand-name">Seraphina OS Harness</span>
      <span class="brand-ver" id="brand-ver" hidden></span>
    </a>
    <span class="topbar-sep" aria-hidden="true"></span>
    <label class="sr-only" for="repo-filter">Repository filter</label>
    <select id="repo-filter" class="select repo-filter" title="Filter by repo">
      <option value="">All repos</option>
    </select>
    <div class="offline-banner" id="offline-banner" role="status" hidden>
      <svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-alert"/></svg>
      <span><strong>Reconnecting…</strong> <span class="offline-more">Live updates are paused, so what you see may be out of date.</span></span>
      <button type="button" class="btn btn-xs" id="offline-retry">Retry now</button>
    </div>
    <div class="topbar-right">
      <span class="conn" id="conn" data-state="connecting" title="Connecting to the live event stream" role="status">
        <span class="conn-dot" aria-hidden="true"></span><span class="conn-label" id="conn-label">Connecting</span>
      </span>
      <a class="conn doctor-badge" id="doctor-badge" href="#/doctor" data-level="unknown" title="Doctor: not run yet">
        <span class="conn-dot" aria-hidden="true"></span><svg class="icon icon-sm doctor-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-doctor"/></svg><span class="doctor-label" id="doctor-label">Doctor</span><span class="doctor-count" id="doctor-count" aria-hidden="true" hidden></span>
      </a>
      <button type="button" class="btn btn-ghost btn-icon" id="theme-toggle" title="Theme: auto" aria-label="Theme: auto (follows system). Click to change.">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-contrast"/></svg>
      </button>
      <button type="button" class="btn btn-primary" id="new-feature-btn" title="New feature (n)">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-plus"/></svg><span class="new-label">New feature</span>
      </button>
    </div>
  </header>

  <!-- data-order places the view modules' entries (SF.registerView nav.order) among these. On a phone the bar holds
       the entries without rail-extra (six); Home reaches every section from there. -->
  <nav class="rail" aria-label="Main">
    <a class="rail-item" href="#/home" data-view="home" data-order="0"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-home"/></svg><span>Home</span></a>
    <a class="rail-item" href="#/factory" data-view="factory" data-order="10"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-factory"/></svg><span>Factory</span><span class="rail-badge" id="rail-human" hidden></span></a>
    <a class="rail-item" href="#/plans" data-view="plans" data-order="20"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-plan"/></svg><span>Plans</span><span class="rail-badge" id="rail-plans" hidden></span></a>
    <a class="rail-item" href="#/chat" data-view="chat" data-order="30"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chat"/></svg><span>Chat</span></a>
    <a class="rail-item rail-extra" href="#/agents" data-view="agents" data-order="80"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-agents"/></svg><span>Agents</span></a>
    <a class="rail-item" href="#/settings" data-view="settings" data-order="90"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-settings"/></svg><span>Settings</span></a>
    <a class="rail-item rail-extra" href="#/grid" data-view="grid" data-order="100"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-grid"/></svg><span>Grid</span></a>
    <a class="rail-item rail-extra" href="#/procedures" data-view="procedures" data-order="110"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-book"/></svg><span>Procedures</span></a>
    <a class="rail-item rail-extra" href="#/doctor" data-view="doctor" data-order="120"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-doctor"/></svg><span>Doctor</span></a>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <section class="view" id="view-home" aria-label="Home" hidden>
      <div class="view-pad view-pad-wide home-pad" id="home-root"></div>
    </section>

    <section class="view view-factory" id="view-factory" aria-label="Factory" hidden>
      <div class="factory-top">
        <div class="strip-card" id="strip-card">
          <div class="strip-head">
            <h2 class="strip-title">Factory line</h2>
            <div class="strip-summary" id="strip-summary"></div>
            <span class="spacer"></span>
            <a class="btn btn-ghost btn-sm strip-routing" id="strip-routing" href="#/settings/routing" title="Which model and driver each step runs on">
              <svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-route"/></svg><span>Routing</span>
            </a>
            <button type="button" class="btn btn-ghost btn-sm btn-icon" id="strip-toggle" aria-expanded="true" aria-controls="strip-scroll" title="Collapse the factory line">
              <svg class="icon icon-sm chev-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chevron-down"/></svg>
            </button>
          </div>
          <div class="strip-scroll" id="strip-scroll">
            <div class="strip-canvas" id="strip-canvas"></div>
          </div>
        </div>
      </div>
      <div class="board-bar">
        <h2 class="board-title">Board <span class="count-pill" id="board-count">0</span></h2>
        <span class="spacer"></span>
        <div class="search">
          <svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <label class="sr-only" for="board-search">Filter jobs</label>
          <input id="board-search" class="input" type="search" placeholder="Filter jobs" autocomplete="off" spellcheck="false">
          <span class="kbd" aria-hidden="true">/</span>
        </div>
        <button type="button" class="btn btn-sm" id="backlog-toggle" aria-expanded="false" aria-controls="backlog">
          <svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-list"/></svg>Backlog
        </button>
      </div>
      <div class="factory-main">
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board" aria-label="Jobs board"></div>
        </div>
        <aside class="backlog" id="backlog" aria-label="Backlog" hidden></aside>
      </div>
    </section>

    <section class="view" id="view-plans" aria-label="Plans" hidden>
      <div class="view-pad view-pad-wide" id="plans-root"></div>
    </section>

    <section class="view view-chat" id="view-chat" aria-label="Chat" hidden>
      <div class="chat-side">
        <div class="chat-side-head">
          <div class="row">
            <h1 class="section-title">Chats</h1>
            <span class="spacer"></span>
            <button type="button" class="btn btn-primary btn-sm" id="new-chat-btn"><svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-plus"/></svg>New chat</button>
          </div>
          <div class="search">
            <svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-search"/></svg>
            <label class="sr-only" for="chat-search">Filter chats</label>
            <input id="chat-search" class="input" type="search" placeholder="Filter chats" autocomplete="off" spellcheck="false">
            <span class="kbd" aria-hidden="true">/</span>
          </div>
        </div>
        <ul class="chat-list" id="chat-list" aria-label="Chats"></ul>
      </div>
      <div class="chat-main" id="chat-main"></div>
    </section>

    <section class="view" id="view-agents" aria-label="Agents" hidden>
      <div class="view-pad" id="agents-root"></div>
    </section>

    <section class="view" id="view-settings" aria-label="Settings" hidden>
      <div class="view-pad" id="settings-root"></div>
    </section>

    <section class="view" id="view-doctor" aria-label="Doctor" hidden>
      <div class="view-pad" id="doctor-root"></div>
    </section>

    <section class="view" id="view-flow" aria-label="Guide" hidden>
      <div class="view-pad view-pad-wide flow-root" id="flow-root"></div>
    </section>

    <section class="view" id="view-grid" aria-label="Grid Card" hidden>
      <div class="view-pad view-pad-wide" id="grid-root"></div>
    </section>

    <section class="view" id="view-procedures" aria-label="Procedures" hidden>
      <div class="view-pad book-pad" id="procedures-root"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
</body>
</html>
