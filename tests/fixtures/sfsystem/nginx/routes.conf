server {
    listen 192.0.2.10:443 ssl;
    server_name beszel.home.example;
    ssl_certificate /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;   # PLANTED-KEY-PATH
    auth_request /oauth2/auth;
    location / {
        proxy_set_header X-Api-Key "PLANTED-SECRET-HEADER";
        proxy_set_header Authorization "Bearer PLANTED-SECRET-TOKEN";
        proxy_pass http://beszel_hub;
    }
    location /oauth2/ {
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
    }
}
server {
    listen 192.0.2.10:8443 ssl;
    server_name files.home.example;
    location / {
        auth_request /oauth2/auth;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /healthz { return 200 "ok"; }
}
